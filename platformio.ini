; WioCraft - voxel survival demo for Seeed Wio Tracker L2 Pro
; ESP32-S3R8 (16 MB QIO flash + 8 MB OPI PSRAM), 320x240 NV3031B QSPI, GT911 touch
[env:wio-l2]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
  -O3
  -ffast-math
  -fno-math-errno
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  lovyan03/LovyanGFX @ 1.2.30
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.2.1.zip
